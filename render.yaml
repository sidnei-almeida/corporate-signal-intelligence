services:
  - type: web
    name: corporate-signal-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: data
      - key: MODELS_DIR
        value: models
      - key: MODEL_PATH
        value: models/isolation_forest_anomaly_pipeline.joblib
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Set in Render Dashboard (Secrets):
      # - GROQ_API_KEY
      # - DATABASE_URL
      # - SEC_USER_AGENT
      # - STOOQ_API_KEY
      # - ALPHA_VANTAGE_API_KEY
