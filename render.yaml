services:
  - type: web
    name: corporate-signal-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set in Render Dashboard (Secrets):
      # - GROQ_API_KEY (optional, for POST /briefing)
      # - GROQ_MODEL (optional, default llama-3.3-70b-versatile)
      # - MODEL_PATH (optional, override models/*.joblib)
